---
# tasks file for apache
  - name: installing packages
    ansible.builtin.dnf:
      name: 
        - httpd
        - firewalld
      state: latest

  - name: start servuce
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
      enabled: true
    loop:
      - httpd
      - firewalld

  - name: configure firewall
    ansible.posix.firewalld:
      service: http
      state: enabled
      immediate: true
      permanent: true

  - name: configure template
    ansible.builtin.template:
      src: index.html.j2
      dest: /var/www/html/index.html

